CONFIG_SPI=y
CONFIG_INPUT=y
# 【変更】CONFIG_PMW3610=y → CONFIG_PMW3610_ALT=y
# 理由: badjeffドライバがZephyr 4.1本家ドライバとの衝突回避で
# Kconfig接頭辞を全部 PMW3610_ALT_* にリネームしたため
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_EXT_POWER=y

# NFCフラグはZephyr 4.1で廃止のため削除済み(代替はoverlayの&uicr)

# 左手トラックボールの座標軸設定
# 【変更】以下すべて PMW3610_* → PMW3610_ALT_* にリネーム(値は据え置き)
CONFIG_PMW3610_ALT_INVERT_Y=n
CONFIG_PMW3610_ALT_SWAP_XY=y
# CONFIG_PMW3610_ALT_INVERT_X=y

# レポート間隔を短くして応答性を向上（右手と同じ）
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=3

# パワーマネジメント設定(force-awake削除によりrest modeが有効に働く)
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=15
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=250

#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
#CONFIG_BT_BUF_ACL_TX_COUNT=32
#CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# ディープスリープ無効化(復帰遅延の解消)
CONFIG_ZMK_SLEEP=n
