CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_EXT_POWER=y

# 右手トラックボールの座標軸設定
CONFIG_PMW3610_ALT_INVERT_Y=y
CONFIG_PMW3610_ALT_SWAP_XY=n
CONFIG_PMW3610_ALT_INVERT_X=n

# レポート間隔を短くして応答性を向上
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=3

# パワーマネジメント設定
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=2000
# 【変更】REST詰め(理由は左と同じ)
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=30000
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=15
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=50
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=100

# 【変更】BLE接続パラメータ: アイドル時の通信間引きを禁止(理由は左と同じ)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

#CONFIG_BT_BUF_ACL_TX_COUNT=32
#CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# ディープスリープ無効化(両半分揃えないと片手だけ寝る)
CONFIG_ZMK_SLEEP=n
