CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_ZMK_EXT_POWER=y

# 【変更】CONFIG_NFCT_PINS_AS_GPIOS=y を削除
# 理由: Zephyr 4.1で廃止。代替はcharybdis_right.overlayの&uicrノード

# 右手トラックボールの座標軸設定を最適化
# Y軸を反転して正しい方向に動くように調整
CONFIG_PMW3610_INVERT_Y=y
# X軸とY軸の入れ替えは無効にして自然な動きに
CONFIG_PMW3610_SWAP_XY=n
# X軸の反転は不要
CONFIG_PMW3610_INVERT_X=n

# レポート間隔を短くして応答性を向上
CONFIG_PMW3610_REPORT_INTERVAL_MIN=3

# パワーマネジメント設定を最適化
# 【注意】dtsi側のforce-awake削除とセットで初めてREST設定が有効になる
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=15
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=250

#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
#CONFIG_BT_BUF_ACL_TX_COUNT=32
#CONFIG_BT_L2CAP_TX_BUF_COUNT=32

#CONFIG_SPI_LOG_LEVEL_DBG=y

#define ZMK_POINTING_DEFAULT_MOVE_VAL 1500 
#define ZMK_POINTING_DEFAULT_SCRL_VAL 20

# 【変更】y→n: ディープスリープ無効化(理由は左と同じ、両半分揃えないと片手だけ寝る)
CONFIG_ZMK_SLEEP=n
