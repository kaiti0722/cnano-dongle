CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

#CONFIG_SPI=y
CONFIG_INPUT=y
#CONFIG_PINCTRL=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
#CONFIG_ZMK_BLE_PROFILE_ADVERTISING=n
CONFIG_ZMK_SLEEP=n
CONFIG_NFCT_PINS_AS_GPIOS=y

# 【変更】charybdis.confから移動: 送信電力+8dBm
# 理由: ドングルはUSB給電なので消費増のデメリットがゼロ。
# 電波を強く維持する役はドングルに任せ、電池側には負担をかけない。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
